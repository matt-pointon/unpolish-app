<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unpolish URL theme force</title>
  <script src="/unpolish/unpolish.js" data-config="url-force.config.json" defer></script>
  <style>
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #1c1914; }
    main { padding: 24px; }
    .card { background: #fff; border: 1px solid #ddd6c8; border-radius: 12px; padding: 16px; }
    .btn { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; }
  </style>
</head>
<body>
  <main>
    <h1 class="title">URL force</h1>
    <div class="card">
      <p>Persisted Sketch must not win over <code>?unpolish=original</code>.</p>
      <button class="btn" type="button">Continue</button>
    </div>
  </main>
</body>
</html>
